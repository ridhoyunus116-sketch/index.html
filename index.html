<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>StreamChamp Compressor</title>
    <style>
        body { 
            background: transparent; 
            color: #00ff00; 
            font-family: 'Courier New', Courier, monospace;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden;
        }
        #status { font-size: 10px; margin-bottom: 5px; text-shadow: 1px 1px 2px black; }
        canvas { width: 200px; height: 40px; border-radius: 5px; background: rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div id="status">CLICK TO ACTIVATE MIC</div>
    <canvas id="visualizer"></canvas>

    <script>
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');

        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                
                // --- KODE COMPRESSOR ---
                const compressor = audioContext.createDynamicsCompressor();
                compressor.threshold.setValueAtTime(-25, audioContext.currentTime); // Mulai tekan di -25dB
                compressor.ratio.setValueAtTime(15, audioContext.currentTime);      // Tekan sekuat 15x
                compressor.knee.setValueAtTime(30, audioContext.currentTime);
                compressor.attack.setValueAtTime(0.003, audioContext.currentTime);
                compressor.release.setValueAtTime(0.25, audioContext.currentTime);

                // --- ANALYSER (Untuk Visualizer) ---
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                // Hubungkan: Mic -> Compressor -> Analyser -> Output
                source.connect(compressor);
                compressor.connect(analyser);
                analyser.connect(audioContext.destination);

                statusDiv.innerText = "COMPRESSOR: ON (LEVEL 6 READY)";
                statusDiv.style.color = "#00ff00";

                function draw() {
                    requestAnimationFrame(draw);
                    analyser.getByteFrequencyData(dataArray);
                    canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    let barWidth = (canvas.width / bufferLength) * 2.5;
                    let x = 0;

                    for(let i = 0; i < bufferLength; i++) {
                        let barHeight = dataArray[i]/4;
                        canvasCtx.fillStyle = `rgb(0, ${barHeight + 100}, 0)`;
                        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                        x += barWidth + 1;
                    }
                }
                draw();
            } catch (err) {
                statusDiv.innerText = "ERROR: " + err.message;
            }
        }

        window.addEventListener('click', initAudio, { once: true });
    </script>
</body>
</html>
